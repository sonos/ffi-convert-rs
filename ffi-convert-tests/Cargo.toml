[package]
name = "ffi-convert-tests"
version = "0.9.0-pre"
authors = ["Sonos", "Anthony Reinette", "Thibaut Lorrain"]
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.32"
ffi-convert = { path ="../ffi-convert" }
