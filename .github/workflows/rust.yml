name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Check formatting
      run: cargo fmt -- --check
    - name: Clippy
      run: cargo clippy -- -D clippy::all
    - name: Install 1.88 toolchain (MSRV)
      run: rustup toolchain install 1.88 --component clippy
    - name: Run tests on MSRV
      run: cargo +1.88 test --verbose
    - name: Run compile checks on MSRV
      run: cargo +1.88 test -p ffi-convert-tests --test compile_checks --features compile-checks --verbose
    - name: Clippy on MSRV
      run: cargo +1.88 clippy -- -D clippy::all
    - name: Install nightly toolchain
      run: rustup toolchain install nightly --component rust-src
    - name: Run tests under ASan
      run: cargo +nightly test --lib --tests -Zbuild-std --target=x86_64-unknown-linux-gnu --features asan --verbose
      env:
        RUSTFLAGS: -Zsanitizer=address
    - name: Run tests under MSan
      run: cargo +nightly test --lib --tests -Zbuild-std --target=x86_64-unknown-linux-gnu --features msan --verbose
      env:
        RUSTFLAGS: -Zsanitizer=memory
